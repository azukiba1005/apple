name: Update Live Carrier & Used Prices

on:
  schedule:
    # 毎週月曜・木曜の午前4時 (JST) = 日曜・水曜の19:00 (UTC)
    - cron: '0 19 * * 0,3'
  workflow_dispatch:
  # 価格収集スクリプトやワークフロー自体を更新したら、最新コードで自動的に新規実行する
  push:
    branches: [main]
    paths:
      - 'scripts/fetch-live-prices.mjs'
      - 'scripts/build-products.mjs'
      - 'scripts/fetch-refurbished.mjs'
      - 'scripts/lib/**'
      - 'data/catalog/**'
      - '.github/workflows/update-prices.yml'

permissions:
  contents: write

# 同時実行による push 競合を防止（古い実行は新しい実行でキャンセル）
concurrency:
  group: update-prices
  cancel-in-progress: true

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository (latest main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Show target commit
        run: git log -1 --oneline

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies & Playwright Chromium
        run: |
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Download AppleDB device data
        run: |
          mkdir -p data/cache
          curl -sSL --retry 3 --fail -o data/cache/appledb-main.json https://api.appledb.dev/device/main.json || echo "AppleDB の事前取得に失敗（build-products.mjs 側で再試行します）"

      - name: Fetch live prices, rebuild products.json & fetch refurbished data
        env:
          # 楽天市場は APIキー不要の公開検索ページ抽出（RAKUTEN_APP_ID は廃止）
          RAKUTEN_PROXY_URL: ${{ secrets.RAKUTEN_PROXY_URL }}
          # Yahoo!ショッピング 商品検索API v3（未登録なら旧 YAHOO_APP_ID を使用）
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID || secrets.YAHOO_APP_ID }}
          # もしもアフィリエイト a_id（Secrets 未登録時は既定の提携ID。Amazon は未提携のため空＝変換なし）
          MOSHIMO_RAKUTEN_AID: ${{ secrets.MOSHIMO_RAKUTEN_AID || secrets.VITE_MOSHIMO_RAKUTEN_AID || '5900939' }}
          MOSHIMO_YAHOO_AID: ${{ secrets.MOSHIMO_YAHOO_AID || secrets.VITE_MOSHIMO_YAHOO_AID || '5900940' }}
          MOSHIMO_AMAZON_AID: ${{ secrets.MOSHIMO_AMAZON_AID || secrets.VITE_MOSHIMO_AMAZON_AID || '' }}
          VITE_MOSHIMO_RAKUTEN_AID: ${{ secrets.VITE_MOSHIMO_RAKUTEN_AID || secrets.MOSHIMO_RAKUTEN_AID || '5900939' }}
          VITE_MOSHIMO_YAHOO_AID: ${{ secrets.VITE_MOSHIMO_YAHOO_AID || secrets.MOSHIMO_YAHOO_AID || '5900940' }}
          VITE_MOSHIMO_AMAZON_AID: ${{ secrets.VITE_MOSHIMO_AMAZON_AID || secrets.MOSHIMO_AMAZON_AID || '' }}
        run: |
          node scripts/fetch-live-prices.mjs
          node scripts/build-products.mjs
          node scripts/fetch-refurbished.mjs

      - name: Commit and push updated price data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache/live-prices-cache.json data/cache/fx-cache.json data/cache/refurbished-cache.json public/products.json public/used-prices.json public/refurbished.json
          if git diff --cached --quiet; then
            echo "価格データに変更はありませんでした。"
            exit 0
          fi
          git commit -m "chore(data): 最新のキャリア価格・中古最安値・整備済品在庫を自動更新"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            echo "push に失敗しました。リトライします ($i/3)"
            sleep 5
          done
          exit 1
