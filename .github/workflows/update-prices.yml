name: Update Live Carrier & Used Prices

on:
  schedule:
    # 毎週月曜・木曜の午前4時 (JST) = 日曜・水曜の19:00 (UTC)
    - cron: '0 19 * * 0,3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies & Playwright Chromium
        run: |
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Fetch live prices & rebuild products.json
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          YAHOO_VC_SID: ${{ secrets.YAHOO_VC_SID }}
          YAHOO_VC_PID: ${{ secrets.YAHOO_VC_PID }}
          YAHOO_MOSHIMO_AID: ${{ secrets.YAHOO_MOSHIMO_AID }}
        run: npm run update:all

      - name: Commit and push updated price data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices/live-prices-cache.json public/products.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): 最新のキャリア価格・中古最安値を自動更新"
            git push
          else
            echo "価格データに変更はありませんでした。"
          fi
